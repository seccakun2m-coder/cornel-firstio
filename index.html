<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cornel Firstio | Kartu Kontak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      color: #f8f8fa;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at top, #34303d 0%, transparent 55%),
        #141418;
    }

    .kartu {
      width: min(100%, 460px);
      padding: 42px 26px 30px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: rgba(30, 29, 35, 0.92);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .inisial {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 2px solid #e98ab2;
      border-radius: 50%;
      color: #ffd5e6;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
    }

    .profesi {
      margin: 10px 0 0;
      color: #e5a6c1;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .bio {
      margin: 22px 0 30px;
      color: #d2d0d7;
      font-size: 16px;
      line-height: 1.7;
    }

    .tautan {
      display: grid;
      gap: 13px;
    }

    .tautan a {
      min-height: 58px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.23);
      border-radius: 999px;
      color: white;
      background: #09090b;
      text-decoration: none;
      font-size: 16px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .tautan a:hover {
      transform: translateY(-2px);
      background: #29252d;
    }

    .tautan a:focus-visible {
      outline: 3px solid #e98ab2;
      outline-offset: 3px;
    }

    .ikon {
      font-size: 20px;
    }

    .catatan {
      margin: 24px 0 0;
      color: #a9a6b0;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="kartu">
    <div class="inisial" aria-hidden="true">CF</div>
